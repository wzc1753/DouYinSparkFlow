name: DouYin Spark Flow Watchdog

on:
  workflow_dispatch: # 允许手动触发
  schedule: # 定时任务
    - cron: "3 9 * * *" # 每天 9:03 UTC（对应北京时间 17:03，检查凌晨任务是否执行）

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: 检查最近的定时任务是否执行
        run: |
          # 主任务在北京时间凌晨 1:03（UTC 前一天 17:03）执行，UTC 日期属于前一天，
          # 因此按"过去 24 小时"窗口在 jq 里精确过滤（API 的 created 参数格式不稳定）；
          # 且只统计主 workflow（schedule.yml），排除看门狗自身的 schedule 运行
          SINCE=$(date -u -d "-24 hours" +%Y-%m-%dT%H:%M:%SZ)
          COUNT=$(curl -s -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?event=schedule&per_page=100" \
            | jq --arg since "$SINCE" '[.workflow_runs[]
                | select(.path == ".github/workflows/schedule.yml")
                | select(.created_at > $since)] | length')

          echo "过去 24 小时（$SINCE 之后）主任务的 schedule 运行记录数: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::主任务超过 24 小时未执行！cron 被丢弃了，请手动补发。"
            exit 1
          else
            echo "过去 24 小时内主任务有 $COUNT 次 schedule 运行，正常。"
          fi
